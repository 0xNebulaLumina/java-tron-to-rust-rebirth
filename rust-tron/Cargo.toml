[workspace]
resolver = "2"
members = [
    "crates/tron-protocol",
    "crates/tron-primitives",
    "crates/tron-config",
    "crates/tron-crypto",
    "crates/tron-shielded",
    "crates/tron-storage",
    "crates/tron-state",
    "crates/tron-tvm",
    "crates/tron-execution",
    "crates/tron-consensus",
    "crates/tron-network",
    "crates/tron-apis",
    "crates/tron-events-metrics",
    "crates/tron-node",
    "crates/tron-toolkit",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85.1"
license = "LGPL-3.0-only"
publish = false

[workspace.dependencies]
prost = "=0.13.5"
prost-build = "=0.13.5"
prost-types = "=0.13.5"
protoc-bin-vendored = "=3.1.0"
tonic = "=0.12.3"
tonic-build = "=0.12.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
