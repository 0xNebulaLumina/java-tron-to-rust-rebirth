[package]
name = "tron-events-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tron-config = { path = "../tron-config" }
tron-execution = { path = "../tron-execution" }
tron-primitives = { path = "../tron-primitives" }
tron-protocol = { path = "../tron-protocol" }
tron-state = { path = "../tron-state" }
bytes = "=1.10.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
thiserror = "=2.0.12"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.15", features = ["rt"] }
zeromq = { version = "=0.4.1", default-features = false, features = ["tokio-runtime", "tcp-transport"] }

[lints]
workspace = true
