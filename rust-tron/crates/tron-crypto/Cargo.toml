[package]
name = "tron-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.22.1"
aes = { version = "=0.8.4", features = ["zeroize"] }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "ecdsa", "sha256", "std"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
ctr = { version = "=0.9.2", features = ["zeroize"] }
hmac = "=0.12.1"
libc = "=0.2.189"
pbkdf2 = "=0.12.2"
ripemd = "=0.1.3"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = "=0.10.9"
scrypt = { version = "=0.11.0", default-features = false }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.143", features = ["preserve_order"] }
sha3 = "=0.10.8"
sm2 = { version = "=0.13.3", default-features = false, features = ["arithmetic", "std"] }
sm3 = "=0.4.2"
subtle = "=2.6.1"
tron-primitives = { path = "../tron-primitives" }
uuid = { version = "=1.18.1", features = ["v4"] }
zeroize = "=1.8.1"

[lints]
workspace = true
