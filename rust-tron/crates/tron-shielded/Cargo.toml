[package]
name = "tron-shielded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "LICENSE-LGPL-3.0"
publish.workspace = true
include = ["Cargo.toml", "LICENSE-LGPL-3.0", "src/**"]

[package.metadata.c006]
provenance-manifest = "../../../docs/oracles/c006-shielded-provenance.v1.json"
proof-boundary = "activated: Sapling spend/output proof generation, contextual and one-shot verification, spend authorization, binding signatures, and pre-ZIP212 note encryption/decryption"
parameter-distribution = "operator-provisioned only; excluded from Rust crate/package/release artifacts; authenticate exact byte length and BLAKE2b-512 before parsing"
parameter-redistribution-rights = "not asserted"
upstream-java-revision = "4a21592f95e37908b21bc3f611c6e7a1a67f09f3"

[package.metadata.c006.parameters.sapling-spend]
path-at-pinned-java-revision = "framework/src/main/resources/params/sapling-spend.params"
git-blob = "f74593027a99a777bb6d14ad9fa80ac393a975c8"
bytes = 48013340
blake2b512 = "25fd9a0d1c1be0526c14662947ae95b758fe9f3d7fb7f55e9b4437830dcc6215a7ce3ea465914b157715b7a4d681389ea4aa84438190e185d5e4c93574d3a19a"

[package.metadata.c006.parameters.sapling-output]
path-at-pinned-java-revision = "framework/src/main/resources/params/sapling-output.params"
