bytes = 3647804
blake2b512 = "a1cb23b93256adce5bce2cb09cefbc96a1d16572675ceb691e9a3626ec15b5b546926ff1c536cfe3a9df07d796b32fdfc3e5d99d65567257bf286cd2858d71a6"

[dependencies]
tron-crypto = { path = "../tron-crypto" }
tron-primitives = { path = "../tron-primitives" }
tron-protocol = { path = "../tron-protocol" }
prost.workspace = true
tokio = { version = "=1.53.1", features = ["sync", "time"] }
tonic.workspace = true
bellman = "=0.14.0"
blake2 = { version = "=0.11.0", features = ["zeroize"] }
bls12_381 = "=0.8.0"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
ff = "=0.13.1"
group = "=0.13.0"
hex = "=0.4.3"
incrementalmerkletree = "=0.8.2"
jubjub = "=0.10.0"
redjubjub = "=0.8.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sapling-crypto = { version = "=0.7.0", features = ["temporary-zcashd"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
zcash_spec = "=0.2.1"
zip32 = "=0.2.1"
zcash_note_encryption = "=0.4.2"
zeroize = { version = "=1.8.1", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.143"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }


[lints]
workspace = true
