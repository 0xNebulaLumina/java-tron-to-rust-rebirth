[package]
name = "tron-tvm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prost.workspace = true
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
p256 = { version = "=0.13.2", features = ["ecdsa"] }
ripemd = "=0.1.3"
sha2 = "=0.10.9"
substrate-bn = "=0.6.0"
ruint = { version = "=1.17.0", default-features = false }
tron-crypto = { path = "../tron-crypto" }
tron-primitives = { path = "../tron-primitives" }
tron-protocol = { path = "../tron-protocol" }
tron-shielded = { path = "../tron-shielded" }
tron-state = { path = "../tron-state" }

[dev-dependencies]
tron-storage = { path = "../tron-storage" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"

[lints]
workspace = true
