[package]
name = "tron-apis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prost.workspace = true
prost-reflect = "=0.14.7"
tonic.workspace = true
tonic-reflection = "=0.12.3"
axum = { version = "=0.7.9", default-features = false, features = ["form", "http1", "json", "tokio"] }
hyper = { version = "=1.5.2", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.10", default-features = false, features = ["http1", "server", "service", "tokio"] }
tower = { version = "=0.5.2", default-features = false, features = ["limit", "timeout", "util"] }
bytes = "1"
flate2 = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
base64 = "=0.22.1"
tron-crypto = { path = "../tron-crypto" }
tron-shielded = { path = "../tron-shielded" }
tron-config = { path = "../tron-config" }
tron-execution = { path = "../tron-execution" }
tron-primitives = { path = "../tron-primitives" }
tron-protocol = { path = "../tron-protocol" }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tron-state = { path = "../tron-state" }
zeroize = "=1.8.1"

[dev-dependencies]
tron-storage = { path = "../tron-storage" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
